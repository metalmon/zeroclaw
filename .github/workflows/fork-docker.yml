# Fork-only: build the debian (shell) container image for a branch and upload it
# as a loadable tar artifact (air-gapped delivery + local E2E). Not for upstream.
name: Fork Docker Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to build
        required: true
        default: feat/fork-device-id

jobs:
  image:
    name: Build image (debian)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - name: Build zeroclaw:f4-debian
        run: |
          # Pilot channel set: telegram, matrix, email, filesystem, git, webhook, whatsapp-web.
          # WhatsApp over the Web protocol, not the Cloud API: the Cloud API needs Meta to reach
          # a public HTTPS webhook, which a closed network does not offer.
          # embedded-web compiles the dashboard into the binary, so no copy on disk can shadow
          # it and the kit image needs no web_dist_dir.
          docker build -f Dockerfile.debian -t zeroclaw:f4-debian             --build-arg ZEROCLAW_CARGO_FLAGS="--no-default-features --features acp-bridge,agent-runtime,channel-email,channel-filesystem,channel-git,channel-matrix,channel-telegram,channel-webhook,embedded-web,gateway,observability-prometheus,schema-export,whatsapp-web"             .
      - name: Save image to a loadable tar
        run: |
          docker save zeroclaw:f4-debian | gzip > zeroclaw-f4-debian.tar.gz
          ls -lh zeroclaw-f4-debian.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-f4-debian-image
          path: zeroclaw-f4-debian.tar.gz
          retention-days: 7
