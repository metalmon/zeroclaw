# Fork-only CI for the assembled `main` build branch (master + our cherry-picked
# patches). NOT an upstream workflow — lives on the `local/dev-tooling` branch so
# it is re-applied by dev-local/rebuild-main.ps1 and never reaches zeroclaw-labs.
#
# Triggers on push to `main` (what rebuild-main.ps1 -Push produces) and manual
# dispatch. Jobs:
#   web           — build the Vite/TS dashboard (web/dist) once; upload as artifact
#   test          — fmt + clippy + tests on Linux (fast red/green)
#   build-windows — release build of the deploy binary; uploads zeroclaw.exe
# `web` runs first because the `embedded-web` feature's build.rs requires
# web/dist/index.html (a gitignored artifact absent from a clean checkout). The
# dist is platform-independent, so both downstream jobs reuse the one artifact.
# test and build-windows do not gate each other, so a lint nit never blocks the
# deployable binary.
name: Fork Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep in sync with dev-local/rebuild-main.ps1 build footer.
  ZC_FEATURES: agent-runtime,gateway,embedded-web,acp-bridge,channel-telegram,plugins-wasm

jobs:
  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      # `cargo web build` (xtask) runs `npm install` + regenerates the TS client
      # + `npm run build` (tsc + vite) into web/dist.
      - name: Build web dashboard
        run: cargo web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (linux)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Deploy-feature signal: exercises the exact reduced feature set the fork
      # ships, so a break under `$ZC_FEATURES` is caught even if the wider
      # default-feature build hides it.
      - name: Tests (deploy feature set, --lib)
        run: cargo test --no-default-features --features "$ZC_FEATURES" --lib
      # Full workspace under DEFAULT features — mirrors upstream's Quality Gate so
      # fork validation catches integration/component tests that `--lib` and the
      # reduced feature set skip (e.g. the `channel-acp-server`-gated ACP stdio
      # component test). Default features pull in mail_parser et al., so the whole
      # workspace compiles here where `--no-default-features` cannot. This is the
      # authoritative red/green: validate a change here BEFORE it reaches an
      # upstream PR.
      - name: Tests (full workspace, default features)
        run: cargo test --workspace --exclude zeroclaw-desktop

  # Clippy is a separate, independent signal: a lint nit anywhere in the merged
  # patch stack must not skip the test run or block the deployable binary.
  lint:
    name: Lint (clippy)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --no-default-features --features "$ZC_FEATURES" -- -D warnings

  build-windows:
    name: Build (windows .exe)
    needs: web
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        shell: bash
        run: cargo build --release --no-default-features --features "$ZC_FEATURES"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-windows-${{ github.sha }}
          path: |
            target/release/zeroclaw.exe
            target/release/zeroclaw-acp-bridge.exe
          if-no-files-found: error
          retention-days: 14
